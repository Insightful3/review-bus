name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # pdftotext for PDF tests; Google Chrome for page tests is preinstalled on ubuntu-latest.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      # Some tests make commits in throwaway repos.
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm ci
      - run: npm test
